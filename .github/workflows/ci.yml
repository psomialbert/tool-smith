name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Linux sandbox backend (bwrap); macOS uses the built-in sandbox-exec.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Go is pinned in mise.toml — dogfood mise to provision it.
      - uses: jdx/mise-action@v2

      - name: Format check
        run: test -z "$(mise exec -- gofmt -l cmd internal)"

      - name: Vet
        run: mise exec -- go vet ./...

      - name: Build
        run: mise exec -- go build ./...

      - name: Test
        run: mise exec -- go test ./...

  # The full two-machine acceptance run (scripts/linux-e2e.sh) needs a
  # privileged container + the private index + a gh token, so it is not run
  # in CI. The sandbox-enforcement code paths it exercises are covered
  # natively by the Go tests above on both runners (bwrap on Linux,
  # sandbox-exec on macOS). Run linux-e2e.sh locally before a release.
