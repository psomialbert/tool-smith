name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Linux sandbox backend (bwrap); macOS uses the built-in sandbox-exec.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Go is pinned in mise.toml — dogfood mise to provision it.
      - uses: jdx/mise-action@v4

      - name: Format check
        run: test -z "$(mise exec -- gofmt -l cmd internal)"

      - name: Vet
        run: mise exec -- go vet ./...

      - name: Build
        run: mise exec -- go build ./...

      - name: Test
        run: mise exec -- go test ./...

  # The full acceptance run (scripts/linux-e2e.sh) needs a privileged container
  # (bubblewrap needs namespace setup) plus mise/go; it uses only local git
  # repos and pushes nothing, so no index or gh token is required. It is not run
  # in CI because of the privileged-container requirement. The
  # sandbox-enforcement code paths it exercises are covered natively by the Go
  # tests above on both runners (bwrap on Linux, sandbox-exec on macOS). Run
  # linux-e2e.sh locally before a release.
